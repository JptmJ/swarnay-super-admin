version: "3.9"

services:
  super-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratnagrid-super-admin
    restart: unless-stopped

    # BACKEND_URL / NEXT_PUBLIC_APP_URL — the server's .env (copy .env.example).
    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 4100

    command: npm run start

    networks:
      - proxy

networks:
  proxy:
    external: true